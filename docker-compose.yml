# Runs Graphnous: the web app, the server, PostgreSQL and Neo4j.
#
#   cp .env.example .env    # then set the passwords
#   docker compose up -d
#
# The web app is on http://localhost:3000 (GRAPHNOUS_WEB_PORT).
#
# The server checks repositories out in the graphnous-checkouts volume, and
# starts git and scanner containers on the host's Docker daemon that mount
# that same volume by name, so it needs the Docker socket.

services:
  web:
    image: ghcr.io/graphnous/graphnous-web:${GRAPHNOUS_VERSION:-edge}
    restart: unless-stopped
    ports:
      - "${GRAPHNOUS_WEB_PORT:-3000}:3000"
    environment:
      # Where the web app's server reaches the API; the browser never calls it
      GRAPHNOUS_API_URL: http://server:1337
    depends_on:
      server:
        condition: service_healthy

  server:
    image: ghcr.io/graphnous/graphnous-server:${GRAPHNOUS_VERSION:-edge}
    restart: unless-stopped
    # Published for uploading scan results and the GitHub App's webhooks;
    # the web app reaches it over the compose network
    ports:
      - "${GRAPHNOUS_SERVER_PORT:-1337}:1337"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-graphnous}
      POSTGRES_USER: ${POSTGRES_USER:-graphnous}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # Checkouts in the checkouts volume, mounted below
      GRAPHNOUS_WORKSPACE_TYPE: volume
      GRAPHNOUS_WORKSPACE_VOLUME: graphnous-checkouts
      GRAPHNOUS_WORKSPACE_PATH: /checkouts
      # Private repositories over SSH: the key, and the host keys of the git
      # servers (known_hosts format); only hosts listed there are fetched from
      GRAPHNOUS_SCANNER_SSH_KEY: ${GRAPHNOUS_GIT_SSH_PRIVATE_KEY:-}
      GRAPHNOUS_SCANNER_SSHKNOWNHOSTS: ${GRAPHNOUS_GIT_SSH_KNOWN_HOSTS:-}
      # The assistant; without a key, it answers with an error
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # The GitHub App, off unless enabled; unset values are left empty
      GRAPHNOUS_GITHUB_ENABLED: ${GRAPHNOUS_GITHUB_ENABLED:-false}
      GRAPHNOUS_SECRETS_KEY: ${GRAPHNOUS_SECRETS_KEY:-}
      GRAPHNOUS_GITHUB_SERVER_URL: ${GRAPHNOUS_GITHUB_SERVER_URL:-}
      GRAPHNOUS_GITHUB_WEBHOOK_URL: ${GRAPHNOUS_GITHUB_WEBHOOK_URL:-}
      GRAPHNOUS_GITHUB_APP_ID: ${GRAPHNOUS_GITHUB_APP_ID:-}
      GRAPHNOUS_GITHUB_PRIVATE_KEY: ${GRAPHNOUS_GITHUB_PRIVATE_KEY:-}
      GRAPHNOUS_GITHUB_WEBHOOK_SECRET: ${GRAPHNOUS_GITHUB_WEBHOOK_SECRET:-}
    # The server runs as a non-root user, which needs the group that owns
    # the Docker socket: 0 on Docker Desktop, usually the docker group on
    # Linux (DOCKER_GID=$(stat -c %g /var/run/docker.sock))
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      # Starts the git and scanner containers on the host's Docker daemon
      - ${GRAPHNOUS_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - checkouts:/checkouts
    healthcheck:
      # The image has no curl or wget; bash's /dev/tcp checks the port is open
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/1337"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 30
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    # Not published on the host: the server reaches it over the compose
    # network, and the default ports are often taken by other Neo4j instances
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:17
    restart: unless-stopped
    # Not published on the host, as Neo4j
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-graphnous}
      POSTGRES_USER: ${POSTGRES_USER:-graphnous}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  checkouts:
    # A fixed name, not prefixed with the compose project, as the server
    # passes it to the containers it starts
    name: graphnous-checkouts
  neo4j-data:
  postgres-data:
